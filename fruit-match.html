<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水果消消乐 · FRUIT MATCH</title>
<style>
:root{
  --paper:#f2ead7;
  --sheet:#fffcf2;
  --ink:#1c1a17;
  --red:#d93a2b;
  --amber:#e8a317;
  --muted:#6b6252;
  --mono:"Courier New","IBM Plex Mono",ui-monospace,monospace;
  --sans:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--sans);color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,rgba(28,26,23,.05) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(28,26,23,.05) 1px,transparent 1px);
  background-size:22px 22px;
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  padding:34px 16px 48px;overflow-x:hidden;
}
.app{
  width:min(600px,100%);
  background:var(--sheet);border:2px solid var(--ink);
  box-shadow:10px 10px 0 var(--ink);
  padding-bottom:18px;
}

/* 票据抬头 */
.topline{
  background:var(--ink);color:var(--sheet);
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  padding:7px 14px;display:flex;justify-content:space-between;gap:10px;
}
.topline b{color:var(--amber);font-weight:700}

header{padding:22px 22px 16px;border-bottom:2px solid var(--ink);position:relative}
.title-row{display:flex;align-items:flex-start;gap:12px}
.mark{width:12px;height:44px;background:var(--red);flex:none;margin-top:3px}
h1{
  margin:0;font-size:clamp(28px,6.4vw,42px);font-weight:900;
  letter-spacing:-.02em;line-height:1.05;
}
h1 .en{
  display:block;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.3em;color:var(--red);margin-top:9px;
}
.sub{
  margin:14px 0 0;font-size:12.5px;line-height:1.6;
  font-family:var(--mono);color:var(--muted);
}
.stamp{
  position:absolute;right:20px;top:20px;
  border:2px solid var(--red);color:var(--red);
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  padding:6px 9px;transform:rotate(6deg);line-height:1.6;text-align:center;
}

/* 记分条 */
.scoreboard{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-bottom:2px solid var(--ink);
}
.stat{padding:14px 16px 12px;border-right:1px solid var(--ink);position:relative}
.stat:last-child{border-right:none}
.stat .label{
  display:block;font-family:var(--mono);font-size:10px;
  letter-spacing:.18em;color:var(--muted);text-transform:uppercase;
}
.stat strong{
  display:block;font-family:var(--mono);font-size:clamp(26px,6.2vw,38px);
  font-weight:700;line-height:1.1;margin-top:6px;letter-spacing:-.04em;
}
.stat:nth-child(1) strong{color:var(--red)}
.stat.danger strong{color:var(--red)}
.stat.danger::after{
  content:"LOW";position:absolute;right:8px;top:10px;
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  background:var(--red);color:#fff;padding:2px 4px;
}

/* 棋盘 */
.board-wrap{position:relative;width:calc(100% - 36px);margin:18px 18px 0;aspect-ratio:1}
.board{
  position:absolute;inset:0;background:var(--sheet);
  border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;
}
.cell{position:absolute;width:10%;height:10%;pointer-events:none}
.cell::before{
  content:"";position:absolute;inset:0;background:#faf4e3;
  border-right:1px solid #e2d6ba;border-bottom:1px solid #e2d6ba;
}
.cell.alt::before{background:#f1e7cd}
.tile{
  position:absolute;width:10%;height:10%;pointer-events:none;
  transition:left .26s cubic-bezier(.22,.7,.3,1),top .26s cubic-bezier(.22,.7,.3,1);
}
.face{
  position:absolute;inset:9%;background:#fffdf6;
  border:1px solid #e0d3b4;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:2px 2px 0 rgba(28,26,23,.10);
  transition:transform .14s,background .14s,border-color .14s,box-shadow .14s;
}
.emoji{font-size:clamp(16px,5vw,30px);line-height:1;user-select:none;-webkit-user-select:none}
.tile.selected .face{
  background:#fff;border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--red);transform:translate(-1px,-1px);
}
.tile.hint .face{
  background:#ffe9a3;border:2px dashed var(--ink);
  animation:hintPulse .5s steps(2,end) infinite alternate;
}
@keyframes hintPulse{to{background:#ffd45c}}
.tile.popping .face{animation:pop .3s ease-out forwards}
@keyframes pop{
  0%{transform:scale(1);opacity:1}
  42%{transform:scale(1.45);opacity:1;background:#ffe9a3;border-color:var(--ink)}
  100%{transform:scale(0);opacity:0}
}
.tile.intro .emoji{animation:intro .32s ease-out backwards;animation-delay:var(--d,0ms)}
@keyframes intro{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.board.shuffling .face{animation:shuf .4s steps(4,end)}
@keyframes shuf{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* 飘字 / 连击 */
.float{
  position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:6;
  font-family:var(--mono);font-size:clamp(12px,2.8vw,16px);font-weight:700;
  color:#fff;background:var(--ink);padding:3px 7px;white-space:nowrap;
  animation:floatUp .9s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-50%) translateY(6px)}
  18%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-160%)}
}
.combo{
  position:absolute;left:50%;top:50%;z-index:7;pointer-events:none;
  font-family:var(--mono);font-size:clamp(18px,5vw,30px);font-weight:700;
  color:#fff;background:var(--red);border:2px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);padding:6px 14px;white-space:nowrap;
  opacity:0;
  transform:translate(-50%,-50%) translateY(10px) scale(.94);
  transition:opacity .24s ease,transform .38s cubic-bezier(.16,.84,.24,1);
  will-change:opacity,transform;
}
.combo.show{
  opacity:1;
  transform:translate(-50%,-50%) translateY(0) scale(1);
}
.combo.out{
  opacity:0;
  transform:translate(-50%,-50%) translateY(-14px) scale(1.02);
  transition:opacity .28s ease,transform .42s ease;
}
.combo-num{display:inline-block;transform-origin:center center}
.combo.bump .combo-num{animation:comboBump .36s cubic-bezier(.2,.9,.25,1)}
@keyframes comboBump{
  0%{transform:scale(1)}
  38%{transform:scale(1.26)}
  100%{transform:scale(1)}
}

/* 提示条 / 结算 */
.toast{
  position:absolute;left:0;right:0;top:0;z-index:8;
  background:var(--ink);color:var(--sheet);padding:11px 14px;
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  opacity:0;pointer-events:none;transform:translateY(-100%);
  transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translateY(0)}
.overlay{
  position:absolute;inset:0;z-index:10;background:var(--sheet);
  border:3px solid var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;animation:fadeIn .25s steps(3,end);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay.hidden{display:none}
.overlay .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--red)}
.overlay h2{margin:6px 0 0;font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:-.02em}
.overlay .rule{width:70%;border-top:1px dashed var(--ink);margin:14px 0;opacity:.6}
.overlay .scorelabel{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted)}
.overlay .final{
  font-family:var(--mono);font-size:clamp(44px,12vw,68px);font-weight:700;
  color:var(--red);line-height:1.1;
}
.overlay p{margin:8px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.overlay button{margin-top:22px}

/* 操作区 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:16px 18px 0}
button{
  font-family:var(--sans);font-size:13px;font-weight:800;letter-spacing:.06em;
  cursor:pointer;color:var(--ink);background:var(--sheet);
  border:2px solid var(--ink);border-radius:0;padding:9px 14px;
  box-shadow:3px 3px 0 var(--ink);
}
button:hover{background:#f2e8cf}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button.primary{background:var(--red);color:#fff}
button.primary:hover{background:#c43326}
.tips{
  margin:16px 18px 0;padding-top:12px;border-top:1px dashed #c9bb9c;
  font-family:var(--mono);font-size:10.5px;line-height:1.9;color:var(--muted);
}
.tips div{display:flex;gap:10px}
.tips .num{color:var(--red);flex:none}
a.btn{
  display:inline-block;text-decoration:none;font-family:var(--sans);
  font-size:13px;font-weight:800;letter-spacing:.06em;
  color:var(--ink);background:var(--sheet);border:2px solid var(--ink);
  border-radius:0;padding:9px 14px;box-shadow:3px 3px 0 var(--ink);
}
a.btn:hover{background:#f2e8cf}
a.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

@media (max-width:480px){
  body{padding:16px 10px 32px}
  .app{box-shadow:6px 6px 0 var(--ink)}
  header{padding:16px 14px 12px}
  .stamp{display:none}
  .stat{padding:10px 8px}
  .board-wrap{width:calc(100% - 24px);margin:14px 12px 0}
  .toolbar{padding:14px 12px 0}
  .tips{margin:14px 12px 0}
}
</style>
</head>
<body>
<div class="app">
  <div class="topline"><span>FRUIT MATCH / 水果消消乐</span><span>NO. <b>001</b> · 10 × 10</span></div>

  <header>
    <div class="stamp">6 KINDS<br>30 MOVES</div>
    <div class="title-row">
      <span class="mark"></span>
      <h1>水果消消乐<span class="en">FRUIT MATCH · THREE IN A ROW</span></h1>
    </div>
    <p class="sub">交换相邻水果，横向或纵向连成三个即可消除。</p>
  </header>

  <div class="scoreboard">
    <div class="stat"><span class="label">Score / 得分</span><strong id="score">0</strong></div>
    <div class="stat" id="movesBox"><span class="label">Moves / 步数</span><strong id="moves">30</strong></div>
    <div class="stat"><span class="label">Best / 最高</span><strong id="best">0</strong></div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
    <div class="toast" id="toast"></div>
    <div class="combo" id="combo"><span class="combo-num" id="comboNum">×2</span> COMBO</div>
    <div class="overlay hidden" id="overlay">
      <div class="kicker">GAME OVER</div>
      <h2>步数用完</h2>
      <div class="rule"></div>
      <div class="scorelabel">FINAL SCORE / 本局得分</div>
      <div class="final" id="finalScore">0</div>
      <p id="endNote">再试一次</p>
      <button id="again" class="primary">再来一局</button>
    </div>
  </div>

  <div class="toolbar">
    <button id="restart" class="primary">重新开局</button>
    <button id="hintBtn">找一步</button>
    <button id="soundBtn">音效 开</button>
    <a class="btn" href="index.html">站点首页</a>
    <a class="btn" href="admin-console.html">控制台</a>
  </div>

  <div class="tips">
    <div><span class="num">01</span><span>点击相邻两格交换，或朝一个方向滑动；方向键同样可用。</span></div>
    <div><span class="num">02</span><span>连击有分数加成，每次有效交换消耗 1 步，无解时自动重新洗牌。</span></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const N = 10;
  const TYPES = ['🍎','🍊','🍇','🍓','🍉','🍒'];
  const MAX_MOVES = 30;

  const boardEl = document.getElementById('board');
  const wrapEl  = document.getElementById('boardWrap');
  const toastEl = document.getElementById('toast');
  const overlayEl = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const bestEl  = document.getElementById('best');
  const movesBox = document.getElementById('movesBox');
  const comboEl = document.getElementById('combo');
  const comboNumEl = document.getElementById('comboNum');

  let board = [];
  let tileEls = new Map();
  let uid = 1;
  let score = 0, moves = MAX_MOVES, best = 0;
  let busy = false, gameOver = false, selected = null, pointerStart = null;
  let muted = false, audioCtx = null;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const randType = () => TYPES[(Math.random() * TYPES.length) | 0];

  try { best = parseInt(localStorage.getItem('fruitMatchBest') || '0', 10) || 0; } catch(e) { best = 0; }
  function saveBest(){ try { localStorage.setItem('fruitMatchBest', String(best)); } catch(e) {} }

  function beep(freq, dur, type, vol){
    if (muted) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || .06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + (dur || .12));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + (dur || .12));
    } catch(e) {}
  }

  /* ---------- 棋盘生成 ---------- */

  function buildCells(){
    const frag = document.createDocumentFragment();
    for (let y = 0; y < N; y++){
      for (let x = 0; x < N; x++){
        const c = document.createElement('div');
        c.className = 'cell' + ((x + y) % 2 ? ' alt' : '');
        c.style.left = (x * 10) + '%';
        c.style.top  = (y * 10) + '%';
        frag.appendChild(c);
      }
    }
    boardEl.appendChild(frag);
  }

  function makeBoard(){
    let guard = 0;
    do {
      board = Array.from({length:N}, () => Array(N).fill(null));
      for (let y = 0; y < N; y++){
        for (let x = 0; x < N; x++){
          let t, tries = 0;
          do {
            t = randType(); tries++;
          } while (tries < 30 && (
            (x >= 2 && board[y][x-1].type === t && board[y][x-2].type === t) ||
            (y >= 2 && board[y-1][x].type === t && board[y-2][x].type === t)
          ));
          board[y][x] = { id: uid++, type: t, intro: true };
        }
      }
      guard++;
    } while (!findMove() && guard < 50);
  }

  /* ---------- 匹配检测 ---------- */

  function findMatches(){
    const cells = new Set();
    const groups = [];
    for (let y = 0; y < N; y++){
      let x = 0;
      while (x < N){
        const t = board[y][x] ? board[y][x].type : null;
        let len = 1;
        while (x + len < N && board[y][x+len] && board[y][x+len].type === t && t !== null) len++;
        if (t !== null && len >= 3){
          const g = [];
          for (let i = 0; i < len; i++){
            g.push({x:x+i, y});
            cells.add((x+i) + ',' + y);
          }
          groups.push(g);
        }
        x += len;
      }
    }
    for (let x = 0; x < N; x++){
      let y = 0;
      while (y < N){
        const t = board[y][x] ? board[y][x].type : null;
        let len = 1;
        while (y + len < N && board[y+len][x] && board[y+len][x].type === t && t !== null) len++;
        if (t !== null && len >= 3){
          const g = [];
          for (let i = 0; i < len; i++){
            g.push({x, y:y+i});
            cells.add(x + ',' + (y+i));
          }
          groups.push(g);
        }
        y += len;
      }
    }
    return { cells, groups };
  }

  function wouldMatch(x, y){
    const t = board[y][x] ? board[y][x].type : null;
    if (t === null) return false;
    let c = 1;
    for (let i = x-1; i >= 0 && board[y][i] && board[y][i].type === t; i--) c++;
    for (let i = x+1; i < N && board[y][i] && board[y][i].type === t; i++) c++;
    if (c >= 3) return true;
    c = 1;
    for (let j = y-1; j >= 0 && board[j][x] && board[j][x].type === t; j--) c++;
    for (let j = y+1; j < N && board[j][x] && board[j][x].type === t; j++) c++;
    return c >= 3;
  }

  // 返回一组可行的相邻交换；无解时返回 null
  function findMove(){
    for (let y = 0; y < N; y++){
      for (let x = 0; x < N; x++){
        for (const d of [[1,0],[0,1]]){
          const nx = x + d[0], ny = y + d[1];
          if (nx >= N || ny >= N) continue;
          const tmp = board[y][x];
          board[y][x] = board[ny][nx];
          board[ny][nx] = tmp;
          const ok = wouldMatch(x,y) || wouldMatch(nx,ny);
          const tmp2 = board[y][x];
          board[y][x] = board[ny][nx];
          board[ny][nx] = tmp2;
          if (ok) return { a:{x,y}, b:{x:nx,y:ny} };
        }
      }
    }
    return null;
  }

  /* ---------- 渲染 ---------- */

  function render(){
    const fresh = [];
    for (let y = 0; y < N; y++){
      for (let x = 0; x < N; x++){
        const t = board[y][x];
        if (!t) continue;
        let el = tileEls.get(t.id);
        if (!el){
          el = document.createElement('div');
          el.className = 'tile' + (t.intro ? ' intro' : '');
          if (t.intro) el.style.setProperty('--d', ((x+y)*26) + 'ms');
          el.innerHTML = '<div class="face"><span class="emoji">' + t.type + '</span></div>';
          el.style.left = (x*10) + '%';
          el.style.top  = ((t.spawnY != null ? t.spawnY : y) * 10) + '%';
          boardEl.appendChild(el);
          tileEls.set(t.id, el);
          fresh.push({el, x, y});
          delete t.spawnY; delete t.intro;
        } else {
          el.style.left = (x*10) + '%';
          el.style.top  = (y*10) + '%';
        }
      }
    }
    if (fresh.length){
      void boardEl.offsetWidth; // 强制布局，让新水果从棋盘上方滑落
      for (const f of fresh){
        f.el.style.left = (f.x*10) + '%';
        f.el.style.top  = (f.y*10) + '%';
      }
    }
  }

  function renderSelection(){
    const old = boardEl.querySelectorAll('.tile.selected');
    for (const el of old) el.classList.remove('selected');
    if (selected && board[selected.y][selected.x]){
      const el = tileEls.get(board[selected.y][selected.x].id);
      if (el) el.classList.add('selected');
    }
  }

  function updateFaces(){
    for (let y = 0; y < N; y++){
      for (let x = 0; x < N; x++){
        const t = board[y][x];
        const el = tileEls.get(t.id);
        if (!el) continue;
        el.querySelector('.emoji').textContent = t.type;
      }
    }
  }

  function updateHUD(){
    scoreEl.textContent = score;
    movesEl.textContent = moves;
    bestEl.textContent = best;
    movesBox.classList.toggle('danger', moves <= 5 && !gameOver);
    if (score > best){ best = score; saveBest(); bestEl.textContent = best; }
  }

  function floatText(px, py, text, cls){
    const el = document.createElement('div');
    el.className = cls || 'float';
    el.textContent = text;
    el.style.left = px + '%';
    el.style.top  = py + '%';
    wrapEl.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  // 连击框只用一个常驻元素：连锁期间复用并更新数字，避免多个弹框叠加
  function showCombo(n){
    comboNumEl.textContent = '×' + n;
    comboEl.classList.remove('out');
    comboEl.classList.add('show');
    comboEl.classList.remove('bump');
    void comboEl.offsetWidth; // 重启数字脉冲动画
    comboEl.classList.add('bump');
  }
  function hideCombo(){
    comboEl.classList.remove('show');
    comboEl.classList.add('out');
  }

  function showToast(text){ toastEl.textContent = text; toastEl.classList.add('show'); }
  function hideToast(){ toastEl.classList.remove('show'); }

  /* ---------- 消除 / 下落 ---------- */

  function collapse(){
    for (let x = 0; x < N; x++){
      let write = N - 1;
      for (let y = N - 1; y >= 0; y--){
        if (board[y][x]){
          board[write][x] = board[y][x];
          if (write !== y) board[y][x] = null;
          write--;
        }
      }
      const holes = write + 1;
      for (let y = holes - 1; y >= 0; y--){
        board[y][x] = { id: uid++, type: randType(), spawnY: y - holes };
      }
    }
    render();
  }

  async function resolveBoard(){
    let combo = 0;
    while (true){
      const { cells, groups } = findMatches();
      if (!cells.size) break;
      combo++;

      let gained = 0;
      for (const g of groups){
        const gain = (g.length * 10 + Math.max(0, g.length - 3) * 15) * combo;
        gained += gain;
        const cx = g.reduce((s,c) => s + c.x, 0) / g.length;
        const cy = g.reduce((s,c) => s + c.y, 0) / g.length;
        floatText((cx + .5) * 10, (cy + .5) * 10, '+' + gain);
      }
      score += gained;
      updateHUD();
      if (combo >= 2) showCombo(combo);
      beep(520 + combo * 110, .14, 'sine', .07);

      for (const key of cells){
        const parts = key.split(',');
        const t = board[+parts[1]][+parts[0]];
        const el = tileEls.get(t.id);
        if (el) el.classList.add('popping');
      }
      await sleep(300);

      for (const key of cells){
        const parts = key.split(',');
        const x = +parts[0], y = +parts[1];
        const t = board[y][x];
        const el = tileEls.get(t.id);
        if (el) el.remove();
        tileEls.delete(t.id);
        board[y][x] = null;
      }
      collapse();
      await sleep(320);
    }
    if (combo >= 2){
      await sleep(260);   // 让最后一个倍数停留一下再退场
      hideCombo();
    }
  }

  /* ---------- 洗牌 ---------- */

  function shuffleArray(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = (Math.random() * (i + 1)) | 0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
  }

  // 重新随机铺满 6 种水果，逐格避开三连（洗牌的兜底方案）
  function fillRandomTypes(){
    for (let y = 0; y < N; y++){
      for (let x = 0; x < N; x++){
        let t, tries = 0;
        do {
          t = randType(); tries++;
        } while (tries < 30 && (
          (x >= 2 && board[y][x-1].type === t && board[y][x-2].type === t) ||
          (y >= 2 && board[y-1][x].type === t && board[y-2][x].type === t)
        ));
        board[y][x].type = t;
      }
    }
  }

  async function shuffleBoard(){
    boardEl.classList.add('shuffling');
    beep(400, .16, 'triangle', .06);
    await sleep(200);

    const types = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) types.push(board[y][x].type);
    const variety = new Set(types).size;
    let ok = false;

    // 优先保留原有水果的分布，只打乱位置
    for (let attempt = 0; attempt < (variety >= 5 ? 400 : 0) && !ok; attempt++){
      shuffleArray(types);
      let i = 0;
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) board[y][x].type = types[i++];
      ok = (findMatches().cells.size === 0) && !!findMove();
    }

    // 兜底：重排始终找不到合法局面时（例如水果种类太少），重新随机生成
    for (let guard = 0; guard < 2000 && !ok; guard++){
      fillRandomTypes();
      ok = (findMatches().cells.size === 0) && !!findMove();
    }

    updateFaces();
    await sleep(240);
    boardEl.classList.remove('shuffling');
  }

  /* ---------- 交换流程 ---------- */

  async function trySwap(a, b){
    if (busy || gameOver) return;
    busy = true;

    const tmp = board[a.y][a.x];
    board[a.y][a.x] = board[b.y][b.x];
    board[b.y][b.x] = tmp;
    render();
    await sleep(260);

    if (!findMatches().cells.size){
      const tmp2 = board[a.y][a.x];
      board[a.y][a.x] = board[b.y][b.x];
      board[b.y][b.x] = tmp2;
      render();
      beep(200, .1, 'sine', .045);
      await sleep(260);
      busy = false;
      return;
    }

    moves--;
    updateHUD();
    beep(700, .1, 'triangle', .05);
    await resolveBoard();

    if (moves <= 0){
      endGame();
    } else if (!findMove()){
      showToast('没有可用步数 · 正在重新洗牌');
      await sleep(1250);
      await shuffleBoard();
      hideToast();
    }
    busy = false;
  }

  function endGame(){
    gameOver = true;
    busy = false;
    selected = null;
    hideCombo();
    renderSelection();
    document.getElementById('finalScore').textContent = score;
    document.getElementById('endNote').textContent =
      score >= best && score > 0 ? 'NEW RECORD / 新纪录' : '再试一次';
    overlayEl.classList.remove('hidden');
    beep(330, .35, 'sine', .07);
    setTimeout(() => beep(440, .4, 'sine', .06), 180);
  }

  /* ---------- 交互 ---------- */

  function posOf(e){
    const r = boardEl.getBoundingClientRect();
    if (e.clientX < r.left - 60 || e.clientX > r.right + 60 ||
        e.clientY < r.top - 60 || e.clientY > r.bottom + 60) return null;
    const x = Math.floor((e.clientX - r.left) / (r.width / N));
    const y = Math.floor((e.clientY - r.top) / (r.height / N));
    return {
      x: Math.max(0, Math.min(N-1, x)),
      y: Math.max(0, Math.min(N-1, y))
    };
  }

  function handleTap(x, y){
    if (!selected){
      selected = {x,y}; renderSelection(); beep(600, .07, 'sine', .035); return;
    }
    if (selected.x === x && selected.y === y){
      selected = null; renderSelection(); return;
    }
    if (Math.abs(selected.x - x) + Math.abs(selected.y - y) === 1){
      const from = selected;
      selected = null; renderSelection();
      trySwap(from, {x,y});
    } else {
      selected = {x,y}; renderSelection(); beep(600, .07, 'sine', .035);
    }
  }

  boardEl.addEventListener('pointerdown', e => {
    if (busy || gameOver) return;
    const p = posOf(e);
    if (!p) return;
    pointerStart = p;
    try { boardEl.setPointerCapture(e.pointerId); } catch(err) {}
  });

  boardEl.addEventListener('pointerup', e => {
    if (!pointerStart) return;
    const s = pointerStart;
    pointerStart = null;
    if (busy || gameOver) return;
    const p = posOf(e);
    if (!p) return;
    const dx = p.x - s.x, dy = p.y - s.y;
    if (dx === 0 && dy === 0){ handleTap(s.x, s.y); return; }
    let tx = s.x, ty = s.y;
    if (Math.abs(dx) >= Math.abs(dy)) tx += Math.sign(dx);
    else ty += Math.sign(dy);
    if (tx < 0 || tx >= N || ty < 0 || ty >= N) return;
    selected = null; renderSelection();
    trySwap({x:s.x, y:s.y}, {x:tx, y:ty});
  });

  boardEl.addEventListener('pointercancel', () => { pointerStart = null; });

  document.addEventListener('keydown', e => {
    if (!selected || busy || gameOver) return;
    const dirs = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] };
    if (e.key === 'Escape'){ selected = null; renderSelection(); return; }
    const d = dirs[e.key];
    if (!d) return;
    e.preventDefault();
    const nx = selected.x + d[0], ny = selected.y + d[1];
    if (nx < 0 || nx >= N || ny < 0 || ny >= N) return;
    const from = selected;
    selected = null; renderSelection();
    trySwap(from, {x:nx, y:ny});
  });

  document.getElementById('hintBtn').addEventListener('click', () => {
    if (busy || gameOver) return;
    const m = findMove();
    if (!m){ showToast('没有可用步数 · 正在重新洗牌'); return; }
    const targets = [m.a, m.b];
    const els = [];
    for (const p of targets){
      const el = tileEls.get(board[p.y][p.x].id);
      if (el){ el.classList.add('hint'); els.push(el); }
    }
    beep(880, .1, 'triangle', .05);
    setTimeout(() => els.forEach(el => el.classList.remove('hint')), 1800);
  });

  document.getElementById('soundBtn').addEventListener('click', e => {
    muted = !muted;
    e.currentTarget.textContent = muted ? '音效 关' : '音效 开';
    if (!muted) beep(660, .1, 'sine', .05);
  });

  function startGame(){
    score = 0; moves = MAX_MOVES;
    busy = false; gameOver = false; selected = null; pointerStart = null;
    tileEls.clear();
    boardEl.innerHTML = '';
    for (const el of wrapEl.querySelectorAll('.float')) el.remove();
    comboEl.classList.remove('show','out','bump');
    buildCells();
    overlayEl.classList.add('hidden');
    hideToast();
    makeBoard();
    updateHUD();
    render();
    setTimeout(() => {
      for (const el of boardEl.querySelectorAll('.tile.intro')) el.classList.remove('intro');
    }, 1300);
  }

  document.getElementById('restart').addEventListener('click', startGame);
  document.getElementById('again').addEventListener('click', startGame);

  startGame();
})();
</script>
